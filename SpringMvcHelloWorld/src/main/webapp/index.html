<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTime User Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-body text-center p-5">
                            <div class="mx-auto mb-4 text-center">
                                <img src="https://png.pngtree.com/png-clipart/20230923/original/pngtree-green-beauty-and-leaf-logo-sign-vector-natural-line-vector-png-image_12733148.png"
                                     alt="NutriTime Logo"
                                     width="80" height="80">
                            </div>

                            <h2 class="card-title mb-3">NutriTime User Management System</h2>
                            <p class="text-muted mb-4">Manage your users with ease</p>

                            <div class="d-grid gap-3 mb-3">
                                <a href="/SpringMvcHelloWorld/login"
                                   class="btn btn-lg"
                                   style="background-color: #A8E6CF; color: #1F3B20; font-weight: 500;">
                                    <i class="fas fa-sign-in-alt me-2"></i>
                                    Login
                                </a>
                            </div>

                            <div class="d-grid gap-3">
                                <a href="/SpringMvcHelloWorld/user/list"
                                   class="btn btn-primary btn-lg">
                                    <i class="fas fa-list me-2"></i>
                                    View Users List
                                </a>
                                
                                <a href="/SpringMvcHelloWorld/user/add"
                                   class="btn btn-success btn-lg">
                                    <i class="fas fa-plus me-2"></i>
                                    Add New Users
                                </a>
                            </div>
                            
                            <div class="mt-4">
                                <small class="text-muted">
                                    Built with Spring MVC & MySQL
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
