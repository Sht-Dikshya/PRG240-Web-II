<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-body text-center p-5">
                            <div class="mx-auto mb-4" style="width: 80px; height: 80px;">
                                <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center h-100">
                                    <i class="fas fa-users text-white fs-2"></i>
                                </div>
                            </div>
                            <h2 class="card-title mb-3">Employee Management System</h2>
                            <p class="text-muted mb-4">Manage your employees with ease</p>
                            
                            <div class="d-grid gap-3">
                                <a href="/SpringMvcHelloWorld/employee/list" 
                                   class="btn btn-primary btn-lg">
                                    <i class="fas fa-list me-2"></i>
                                    View Employee List
                                </a>
                                
                                <a href="/SpringMvcHelloWorld/employee/add" 
                                   class="btn btn-success btn-lg">
                                    <i class="fas fa-plus me-2"></i>
                                    Add New Employee
                                </a>
                            </div>
                            
                            <div class="mt-4">
                                <small class="text-muted">
                                    Built with Spring MVC & MySQL
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
