<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Authentication Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">JWT Authentication Test</h1>
            
            <!-- Login Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">1. Login to Get JWT Token</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
                    </div>
                </div>
                <div class="mt-4">
                    <button onclick="login()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                        Login
                    </button>
                    <button onclick="register()" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-md transition duration-200 ml-2">
                        Register
                    </button>
                </div>
                <div id="loginResult" class="mt-4"></div>
            </div>

            <!-- Token Display Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">2. JWT Token</h2>
                <div class="bg-gray-100 p-4 rounded-md">
                    <textarea id="tokenDisplay" class="w-full h-20 text-sm font-mono bg-transparent border-none resize-none" readonly placeholder="JWT token will appear here after login"></textarea>
                </div>
                <div class="mt-2">
                    <button onclick="copyToken()" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-1 px-3 rounded-md text-sm transition duration-200">
                        Copy Token
                    </button>
                    <button onclick="validateToken()" class="bg-purple-500 hover:bg-purple-600 text-white font-medium py-1 px-3 rounded-md text-sm transition duration-200 ml-2">
                        Validate Token
                    </button>
                </div>
                <div id="tokenResult" class="mt-4"></div>
            </div>

            <!-- Form Submission Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">3. Submit Form Data with JWT Token</h2>
                <form id="loginForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Login Name *</label>
                        <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter login name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter email">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
                        <input type="text" name="department" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter department">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Position</label>
                        <input type="text" name="position" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter position">
                    </div>
                </form>
                <div class="mt-4">
                    <button onclick="submitForm()" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                        Submit Form Data
                    </button>
                    <button onclick="getAllLogins()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition duration-200 ml-2">
                        Get All Logins
                    </button>
                </div>
                <div id="formResult" class="mt-4"></div>
            </div>

            <!-- Demo Credentials -->
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                <h3 class="text-lg font-semibold text-yellow-800 mb-2">Demo Credentials</h3>
                <div class="text-sm text-yellow-700">
                    <p><strong>Username:</strong> admin, <strong>Password:</strong> admin123</p>
                    <p><strong>Username:</strong> user, <strong>Password:</strong> user123</p>
                    <p><strong>Username:</strong> test, <strong>Password:</strong> test123</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');

            if (!username || !password) {
                showResult(resultDiv, 'Please enter both username and password', 'error');
                return;
            }

            try {
                const response = await fetch('/SpringMvcHelloWorld/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentToken = data.token;
                    document.getElementById('tokenDisplay').value = currentToken;
                    showResult(resultDiv, `Login successful! Welcome ${data.username}`, 'success');
                } else {
                    showResult(resultDiv, data.message || 'Login failed', 'error');
                }
            } catch (error) {
                showResult(resultDiv, 'Error: ' + error.message, 'error');
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');

            if (!username || !password) {
                showResult(resultDiv, 'Please enter both username and password', 'error');
                return;
            }

            try {
                const response = await fetch('/SpringMvcHelloWorld/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                showResult(resultDiv, data.message, data.success ? 'success' : 'error');
            } catch (error) {
                showResult(resultDiv, 'Error: ' + error.message, 'error');
            }
        }

        async function validateToken() {
            if (!currentToken) {
                showResult(document.getElementById('tokenResult'), 'No token available. Please login first.', 'error');
                return;
            }

            try {
                const response = await fetch('/SpringMvcHelloWorld/api/auth/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: currentToken })
                });

                const data = await response.json();
                showResult(document.getElementById('tokenResult'), data.message, data.success ? 'success' : 'error');
            } catch (error) {
                showResult(document.getElementById('tokenResult'), 'Error: ' + error.message, 'error');
            }
        }

        async function submitForm() {
            if (!currentToken) {
                showResult(document.getElementById('formResult'), 'Please login first to get a JWT token', 'error');
                return;
            }

            const formData = new FormData(document.getElementById('loginForm'));
            const resultDiv = document.getElementById('formResult');

            try {
                const response = await fetch('/SpringMvcHelloWorld/api/login/submit-form', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + currentToken
                    },
                    body: formData
                });

                const data = await response.json();
                showResult(resultDiv, data.message, data.success ? 'success' : 'error');
                
                if (data.success && data.login) {
                    showResult(resultDiv, `Form submitted successfully! Login ID: ${data.login.id}`, 'success');
                }
            } catch (error) {
                showResult(resultDiv, 'Error: ' + error.message, 'error');
            }
        }

        async function getAllLogins() {
            if (!currentToken) {
                showResult(document.getElementById('formResult'), 'Please login first to get a JWT token', 'error');
                return;
            }

            const resultDiv = document.getElementById('formResult');

            try {
                const response = await fetch('/SpringMvcHelloWorld/api/login', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + currentToken
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    let message = `Found ${data.count} logins:\n`;
                    data.logins.forEach(emp => {
                        message += `- ${emp.name} (ID: ${emp.id})\n`;
                    });
                    showResult(resultDiv, message, 'success');
                } else {
                    showResult(resultDiv, data.message, 'error');
                }
            } catch (error) {
                showResult(resultDiv, 'Error: ' + error.message, 'error');
            }
        }

        function copyToken() {
            const tokenDisplay = document.getElementById('tokenDisplay');
            tokenDisplay.select();
            document.execCommand('copy');
            showResult(document.getElementById('tokenResult'), 'Token copied to clipboard!', 'success');
        }

        function showResult(element, message, type) {
            element.innerHTML = `<div class="p-3 rounded-md ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${message}</div>`;
        }
    </script>
</body>
</html>
