# Database Configuration for XAMPP MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/logindb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Console (for development - commented out when using MySQL)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration for MySQL - Automatic table creation
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.com.example=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# Application specific properties
app.database.connection.timeout=30000
app.database.max.retries=3

# JWT Configuration
# Secret key must be at least 512 bits (64 characters) for HS512 algorithm
jwt.secret=mySecretKey1234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890
jwt.expiration=86400000
